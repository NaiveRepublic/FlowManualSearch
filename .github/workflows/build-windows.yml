name: Build Windows exe

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -r requirements-app.txt
      - name: Check the search engine
        run: python app/main.py --selftest
      - name: Package the exe
        run: python -m PyInstaller --noconfirm --clean FlowManualSearch.spec
      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: FlowManualSearch
          path: dist/FlowManualSearch.exe
          retention-days: 30
